name: Inject maintenance gate v2

on:
  push:
    branches: [main]
    paths:
      - 'maintenance-gate-v2.js'
      - '.github/workflows/inject-maintenance-gate-v2.yml'

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inject blocking maintenance script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text()

          gate_tag = '<script src="maintenance-gate-v2.js?v=20260907-maintenance-audio-v4"></script>'
          flux_tag = '<script src="vm-radio-flux-central.js?v=20260907-maintenance-audio-v4"></script>'

          # Force un nouvel URL de script afin qu'une PWA ouverte ne conserve pas
          # l'ancienne version qui mettait encore le lecteur audio en pause.
          if re.search(r'<script src="maintenance-gate-v2\.js\?v=[^"]+"></script>', s):
              s = re.sub(
                  r'<script src="maintenance-gate-v2\.js\?v=[^"]+"></script>',
                  gate_tag,
                  s,
                  count=1
              )
          else:
              marker = re.search(r'<script src="vm-radio-flux-central\.js\?v=[^"]+"></script>', s)
              if marker:
                  s = s[:marker.start()] + gate_tag + s[marker.start():]
              else:
                  s = s.replace('</head>', gate_tag + '</head>', 1)

          if re.search(r'<script src="vm-radio-flux-central\.js\?v=[^"]+"></script>', s):
              s = re.sub(
                  r'<script src="vm-radio-flux-central\.js\?v=[^"]+"></script>',
                  flux_tag,
                  s,
                  count=1
              )

          p.write_text(s)
          PY

      - name: Commit change
        run: |
          if git diff --quiet; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Force fresh maintenance audio scripts"

          # D'autres workflows VM RADIO peuvent pousser sur main au même moment.
          # On se remet à jour puis on réessaie au lieu d'abandonner le cache-bust.
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin main; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done

          echo "Impossible de publier index.html après plusieurs tentatives."
          exit 1
