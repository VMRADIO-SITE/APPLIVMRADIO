name: VM RADIO - Version globale du site

on:
  push:
    branches: [main]
    paths-ignore:
      - "version.json"
      - "data/radioking-latest.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-version:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Générer la version globale
        run: |
          set -euo pipefail
          cat > version.json <<EOF
          {
            "version": "${GITHUB_SHA}"
          }
          EOF

      - name: Enregistrer la version
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json
          if git diff --cached --quiet; then
            echo "Aucun changement de version."
            exit 0
          fi
          git commit -m "chore: update global site version"
          git push
