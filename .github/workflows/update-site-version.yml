name: VM RADIO - Version globale du site

on:
  push:
    branches: [main]
    paths-ignore:
      - "version.json"
      - "data/radioking-latest.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-version:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Vérifier qu'une vraie modification du site existe
        id: site-change
        shell: bash
        run: |
          set -euo pipefail
          if git diff --name-only HEAD^ HEAD | grep -Ev '^(version\.json|data/radioking-latest\.json)$' | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Générer la version globale
        if: steps.site-change.outputs.changed == 'true'
        run: |
          set -euo pipefail
          cat > version.json <<EOF
          {
            "version": "${GITHUB_SHA}"
          }
          EOF

      - name: Enregistrer la version
        if: steps.site-change.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json
          if git diff --cached --quiet; then
            echo "Aucun changement de version."
            exit 0
          fi
          git commit -m "chore: update global site version"
          git fetch origin main
          git rebase origin/main
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
          done
          echo "Impossible de pousser la mise à jour de version après 3 tentatives."
          exit 1
