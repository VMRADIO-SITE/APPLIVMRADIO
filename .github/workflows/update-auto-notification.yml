name: VM RADIO - Notification automatique mise à jour

on:
  workflow_run:
    workflows: ["pages-build-deployment"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify-update:
    # IMPORTANT : aucune notification si le déploiement GitHub Pages a échoué.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Vérifier que la version publiée est accessible
        if: ${{ github.event_name == 'workflow_run' }}
        run: |
          set -euo pipefail
          echo "Attente de la publication de VM RADIO..."
          for i in {1..12}; do
            if curl -fsS --max-time 10 "https://app.vmradio.fr/version.json?check=$(date +%s)" >/dev/null; then
              echo "Version publiée accessible."
              exit 0
            fi
            echo "Publication pas encore accessible, nouvelle vérification..."
            sleep 10
          done
          echo "La version publiée n'est pas accessible après attente."
          exit 1

      - name: Installer Firebase Admin SDK
        run: npm install --no-save firebase-admin@13

      - name: Envoyer la notification FCM de mise à jour
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${FIREBASE_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "Le secret FIREBASE_SERVICE_ACCOUNT_JSON n'est pas configuré."
            exit 1
          fi

          node <<'NODE'
          const admin = require('firebase-admin');
          const serviceAccount = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT_JSON);
          admin.initializeApp({ credential: admin.credential.cert(serviceAccount) });

          const db = admin.firestore();
          const messaging = admin.messaging();

          const DEFAULT_TITLE = 'Mise à jour disponible';
          const DEFAULT_BODY = 'Une nouvelle version de VM RADIO est disponible.';
          const DEFAULT_LINK = 'https://app.vmradio.fr/';

          (async () => {
            const configRef = db.collection('notificationSettings').doc('update');
            const configSnapshot = await configRef.get();
            const config = configSnapshot.exists ? configSnapshot.data() : {};

            if (config.enabled === false) {
              console.log('Notification de mise à jour désactivée dans Firestore.');
              return;
            }

            const title = String(config.title || DEFAULT_TITLE).trim() || DEFAULT_TITLE;
            const body = String(config.body || DEFAULT_BODY).trim() || DEFAULT_BODY;
            const link = String(config.url || DEFAULT_LINK).trim() || DEFAULT_LINK;

            const snapshot = await db.collection('fcmTokens').get();
            const tokens = snapshot.docs
              .map(doc => String(doc.get('token') || '').trim())
              .filter(Boolean);

            console.log(`Tokens FCM trouvés : ${tokens.length}`);
            if (!tokens.length) return;

            for (let i = 0; i < tokens.length; i += 500) {
              const batch = tokens.slice(i, i + 500);
              const response = await messaging.sendEachForMulticast({
                tokens: batch,
                notification: { title, body },
                data: {
                  title,
                  body,
                  url: link,
                  type: 'app-update',
                  tag: 'vm-radio-mise-a-jour'
                },
                webpush: { fcmOptions: { link } }
              });

              console.log(`Lot ${Math.floor(i / 500) + 1}: ${response.successCount} succès, ${response.failureCount} échecs.`);

              for (let j = 0; j < response.responses.length; j++) {
                const result = response.responses[j];
                if (!result.success) {
                  const code = result.error?.code || '';
                  if (code.includes('registration-token-not-registered') || code.includes('invalid-registration-token')) {
                    const stale = snapshot.docs.find(doc => doc.get('token') === batch[j]);
                    if (stale) await stale.ref.delete();
                  }
                }
              }
            }
          })().catch(error => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
