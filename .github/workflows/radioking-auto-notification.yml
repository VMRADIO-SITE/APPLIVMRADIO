name: VM RADIO - Notification automatique nouvelle musique

on:
  repository_dispatch:
    types:
      - new_music
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Firebase Admin SDK
        run: npm install --no-save firebase-admin@13

      - name: Envoyer la notification FCM
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          NEW_MUSIC_ID: ${{ github.event.client_payload.id }}
          NEW_MUSIC_TITLE: ${{ github.event.client_payload.title }}
          NEW_MUSIC_ARTIST: ${{ github.event.client_payload.artist }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${FIREBASE_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "Le secret FIREBASE_SERVICE_ACCOUNT_JSON n'est pas configuré."
            exit 1
          fi

          node <<'NODE'
          const admin = require('firebase-admin');

          const serviceAccount = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT_JSON);
          admin.initializeApp({ credential: admin.credential.cert(serviceAccount) });

          const db = admin.firestore();
          const messaging = admin.messaging();
          const musicId = String(process.env.NEW_MUSIC_ID || '').trim();
          const rawTitle = String(process.env.NEW_MUSIC_TITLE || 'Nouvelle Musique').trim();
          const artist = String(process.env.NEW_MUSIC_ARTIST || 'Music IA By Valentin').trim();
          const songTitle = rawTitle
            ? rawTitle.charAt(0).toLocaleUpperCase('fr-FR') + rawTitle.slice(1)
            : 'Nouvelle Musique';
          const notificationTitle = '🎵 Nouvelle musique sur VM RADIO';
          const body = artist
            ? `${songTitle} — ${artist} est maintenant disponible !`
            : `${songTitle} est maintenant disponible sur VM RADIO !`;
          const link = 'https://app.vmradio.fr/';
          const tag = musicId ? `vm-radio-new-music-${musicId}` : 'vm-radio-nouvelle-musique';

          (async () => {
            if (musicId) {
              const sentRef = db.collection('notificationHistory').doc(`new_music_${musicId}`);
              const sent = await sentRef.get();
              if (sent.exists) {
                console.log(`ID ${musicId} déjà notifié. Envoi annulé pour éviter un doublon.`);
                return;
              }

              await sentRef.set({
                type: 'new_music',
                musicId,
                title: songTitle,
                artist,
                createdAt: admin.firestore.FieldValue.serverTimestamp()
              });
            }

            const snapshot = await db.collection('fcmTokens').get();
            const tokens = snapshot.docs
              .map(doc => String(doc.get('token') || '').trim())
              .filter(Boolean);

            console.log(`Nouvelle musique ID: ${musicId || 'inconnu'}`);
            console.log(`Tokens FCM trouvés : ${tokens.length}`);
            if (!tokens.length) return;

            for (let i = 0; i < tokens.length; i += 500) {
              const batch = tokens.slice(i, i + 500);
              const response = await messaging.sendEachForMulticast({
                tokens: batch,
                notification: { title: notificationTitle, body },
                data: {
                  type: 'new_music',
                  musicId,
                  songTitle,
                  artist,
                  title: notificationTitle,
                  body,
                  url: link,
                  tag
                },
                webpush: {
                  notification: { tag },
                  fcmOptions: { link }
                }
              });

              console.log(`Lot ${Math.floor(i / 500) + 1}: ${response.successCount} succès, ${response.failureCount} échecs.`);

              for (let j = 0; j < response.responses.length; j++) {
                const result = response.responses[j];
                if (!result.success) {
                  const code = result.error?.code || '';
                  if (code.includes('registration-token-not-registered') || code.includes('invalid-registration-token')) {
                    const token = batch[j];
                    const stale = snapshot.docs.find(doc => doc.get('token') === token);
                    if (stale) await stale.ref.delete();
                  }
                }
              }
            }
          })().catch(error => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
