name: Migration VM RADIO Engine

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate-vmradio-engine.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Basculer le site/app sur le nouveau moteur
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          stream = 'https://radio.vmradio.fr/radio.mp3'
          central = '<script src="vm-radio-flux-central.js"></script>'

          for p in Path('.').glob('*.html'):
              s = p.read_text(encoding='utf-8')
              old = s

              # Tous les anciens flux audio RadioKing deviennent le flux VM RADIO.
              s = s.replace('https://play.radioking.io/vm-radio2', stream)
              s = s.replace('https://api.radioking.io/radio/917591/listen.m3u', stream)
              s = s.replace('https://api.radioking.io/radio/917591/listen', stream)

              # Charger le pont moteur avant tous les scripts inline historiques.
              if 'vm-radio-flux-central.js' not in s:
                  s = s.replace('</head>', central + '\n</head>', 1)
              else:
                  # S'il est déjà chargé en fin de page, ajouter aussi un chargement précoce dans head.
                  head = s.split('</head>',1)[0]
                  if 'vm-radio-flux-central.js' not in head:
                      s = s.replace('</head>', central + '\n</head>', 1)

              if s != old:
                  p.write_text(s, encoding='utf-8')

          # Nettoyer aussi les anciens flux dans les JS dédiés.
          for p in Path('.').glob('*.js'):
              if p.name in {'vm-radio-flux-central.js','vm-radio-flux.js'}:
                  continue
              s = p.read_text(encoding='utf-8')
              old = s
              s = s.replace('https://play.radioking.io/vm-radio2', stream)
              s = s.replace('https://api.radioking.io/radio/917591/listen.m3u', stream)
              s = s.replace('https://api.radioking.io/radio/917591/listen', stream)
              if s != old:
                  p.write_text(s, encoding='utf-8')
          PY
      - name: Commit migration
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Aucun changement nécessaire.'
            exit 0
          fi
          git config user.name 'VM RADIO Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add '*.html' '*.js'
          git commit -m 'Bascule audio et métadonnées sur VM RADIO Engine [skip ci]'
          git push
