name: Temporary footer update

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: contains(github.event.head_commit.message, '[footer-update]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update VM RADIO footer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          old = 'Appli propulsée par <strong>Music IA By Valentin</strong>'
          new = 'Appli propulsée par <strong>Music IA By Valentin &amp; ChatGPT</strong>'

          changed = []
          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              if old in text:
                  updated = text.replace(old, new)
                  if updated != text:
                      path.write_text(updated, encoding='utf-8')
                      changed.append(str(path))

          print('Fichiers modifiés:', ', '.join(changed) if changed else 'aucun')
          PY

      - name: Commit footer update and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/temporary-footer-update.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' .github/workflows/temporary-footer-update.yml
          if git diff --cached --quiet; then
            echo "Aucune modification à publier."
            exit 0
          fi
          git commit -m "Update VM RADIO footer with ChatGPT"
          git push
