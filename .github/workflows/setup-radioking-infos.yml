name: Installer Infos en temps réel RadioKing

on:
  push:
    paths:
      - '.github/workflows/setup-radioking-infos.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Ajouter le module Infos en temps réel
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          path = Path('infos.html')
          text = path.read_text(encoding='utf-8')
          marker = '<!-- VM-RADIO-LIVE-INFO -->'
          if marker in text:
              print('Module déjà installé.')
              raise SystemExit(0)

          css = '''\n<style id="vm-radioking-live-css">\n#vm-radioking-live-info{margin:14px 0;background:linear-gradient(145deg,#11101a,#08080e);border:1px solid #5d278a;border-radius:15px;padding:16px;box-shadow:0 0 18px rgba(121,44,188,.10)}\n.vmrk-badge{display:flex;align-items:center;gap:7px;color:#d68cff;font-size:11px;font-weight:800;letter-spacing:.4px;margin-bottom:11px}.vmrk-badge span{width:7px;height:7px;border-radius:50%;background:#31d17b;box-shadow:0 0 7px #31d17b}\n.vmrk-main{display:flex;align-items:center;gap:12px}.vmrk-cover{width:64px;height:64px;flex:0 0 64px;border-radius:10px;object-fit:cover;border:1px solid #5b277d;background:#0b0711}.vmrk-info{min-width:0}.vmrk-label{font-size:10px;color:#aaa5b4;margin-bottom:3px}.vmrk-title{font-size:16px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.vmrk-artist{font-size:11px;color:#b85cff;margin-top:4px}.vmrk-date{font-size:9px;color:#777080;margin-top:7px}.vmrk-empty{text-align:center;color:#aaa5b4;font-size:10px;padding:8px}\n@media(max-width:700px){#vm-radioking-live-info{padding:13px}.vmrk-title{font-size:14px}.vmrk-cover{width:54px;height:54px;flex-basis:54px}}\n</style>\n'''
          block = f'''\n{css}\n<!-- VM-RADIO-LIVE-INFO -->\n<section id="vm-radioking-live-info" aria-label="Infos en temps réel">\n  <div class="vmrk-empty">Chargement des informations en temps réel…</div>\n</section>\n<script src="./radioking-infos.js"></script>\n'''
          if '</body>' not in text.lower():
              raise SystemExit('Balise </body> introuvable dans infos.html')
          idx = text.lower().rfind('</body>')
          text = text[:idx] + block + text[idx:]
          path.write_text(text, encoding='utf-8')
          print('Module installé dans infos.html')
          PY

      - name: Publier la modification
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'VM RADIO Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add infos.html
          if git diff --cached --quiet; then
            echo 'Aucune modification à publier.'
            exit 0
          fi
          git commit -m 'Ajout Infos en temps réel RadioKing'
          git push
