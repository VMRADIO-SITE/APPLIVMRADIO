name: Fix contact form AJAX

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch infos.html
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('infos.html')
          s = p.read_text(encoding='utf-8')

          s = s.replace(
              '<form class="contact-form" id="contactForm" action="https://formsubmit.co/contact@vmradio.fr" method="POST">',
              '<form class="contact-form" id="contactForm" action="https://formsubmit.co/ajax/contact@vmradio.fr" method="POST">',
              1
          )
          s = s.replace(
              '    <input type="hidden" name="_next" value="https://vmradio.fr/infos.html">\n',
              '',
              1
          )
          s = s.replace(
              '    <p class="contact-help">Le bouton prépare votre e-mail à destination de contact@vmradio.fr.</p>',
              '    <p class="contact-help" id="contactStatus" aria-live="polite">Votre message sera envoyé directement depuis cette page.</p>',
              1
          )

          marker = '<script id="vm-contact-form">'
          ajax = '''<script id="vm-contact-ajax">
          (function(){
            const form = document.getElementById("contactForm");
            if (!form || form.dataset.ajaxBound) return;
            form.dataset.ajaxBound = "1";
            form.addEventListener("submit", async function(e){
              e.preventDefault();
              const status = document.getElementById("contactStatus");
              const button = form.querySelector('button[type="submit"]');
              if (status) status.textContent = "Envoi en cours…";
              if (button) { button.disabled = true; button.textContent = "⏳ ENVOI EN COURS…"; }
              try {
                const response = await fetch("https://formsubmit.co/ajax/contact@vmradio.fr", {
                  method: "POST",
                  headers: { "Accept": "application/json" },
                  body: new FormData(form)
                });
                const data = await response.json().catch(() => ({}));
                if (!response.ok || data.success === false) throw new Error("send failed");
                form.reset();
                if (status) { status.textContent = "✅ Message envoyé avec succès !"; status.style.color = "#31d17b"; }
              } catch (err) {
                if (status) { status.textContent = "❌ Impossible d’envoyer le message. Réessayez."; status.style.color = "#ff7b8a"; }
              } finally {
                if (button) { button.disabled = false; button.textContent = "✉️ ENVOYER LE MESSAGE"; }
              }
            }, true);
          })();
          </script>
          '''
          if marker in s and 'id="vm-contact-ajax"' not in s:
              s = s.replace(marker, ajax + marker, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add infos.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix contact form AJAX submission"
          git push
