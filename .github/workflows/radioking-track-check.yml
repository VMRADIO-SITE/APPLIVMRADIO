name: RadioKing - Détection du titre en cours

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: radioking-track-check
  cancel-in-progress: true

jobs:
  check-track:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Récupérer le titre RadioKing
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL 'https://api.radioking.io/widget/radio/vm-radio2/track/current' -o track.json
          cat track.json

      - name: Restaurer le dernier titre connu
        uses: actions/cache/restore@v4
        with:
          path: .radioking-state
          key: radioking-state-${{ github.run_id }}
          restore-keys: |
            radioking-state-

      - name: Détecter le changement de titre
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .radioking-state

          CURRENT_ID="$(node -e "const d=require('./track.json'); process.stdout.write(String(d.id ?? ''))")"
          CURRENT_ARTIST="$(node -e "const d=require('./track.json'); process.stdout.write(String(d.artist ?? ''))")"
          CURRENT_TITLE="$(node -e "const d=require('./track.json'); process.stdout.write(String(d.title ?? ''))")"

          LAST_ID=""
          if [ -f .radioking-state/last_track_id.txt ]; then
            LAST_ID="$(cat .radioking-state/last_track_id.txt)"
          fi

          echo "Dernier ID connu : ${LAST_ID:-aucun}"
          echo "ID actuel       : ${CURRENT_ID:-inconnu}"
          echo "Artiste         : ${CURRENT_ARTIST:-inconnu}"
          echo "Titre           : ${CURRENT_TITLE:-inconnu}"

          if [ -z "$CURRENT_ID" ]; then
            echo "new_track=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ Aucun ID RadioKing reçu. Aucun déclenchement."
            exit 0
          fi

          if [ "$CURRENT_ID" = "$LAST_ID" ]; then
            echo "new_track=false" >> "$GITHUB_OUTPUT"
            echo "⏭️ Même titre qu'au dernier passage : aucune nouvelle publication."
          else
            echo "new_track=true" >> "$GITHUB_OUTPUT"
            echo "🎵 Nouveau titre détecté !"
          fi

          printf '%s' "$CURRENT_ID" > .radioking-state/last_track_id.txt

      - name: Préparer les données Infos en temps réel
        if: steps.detect.outputs.new_track == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const d = require('./track.json');
          const out = {
            id: d.id ?? '',
            title: d.title ?? '',
            artist: d.artist ?? '',
            started_at: d.started_at ?? null,
            end_at: d.end_at ?? null,
            cover: d.cover ?? d.cover_url ?? d.image ?? '',
            updated_at: new Date().toISOString()
          };
          fs.mkdirSync('data', { recursive: true });
          fs.writeFileSync('data/radioking-latest.json', JSON.stringify(out, null, 2) + '\n');
          NODE

      - name: Publier dans Infos en temps réel
        if: steps.detect.outputs.new_track == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'VM RADIO Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/radioking-latest.json
          if git diff --cached --quiet; then
            echo 'Aucune modification à publier.'
            exit 0
          fi
          git commit -m 'Mise à jour Infos en temps réel - RadioKing'
          git push

      - name: Mémoriser le titre pour les prochaines exécutions
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .radioking-state
          key: radioking-state-${{ github.run_id }}

      - name: Résultat
        if: steps.detect.outputs.new_track == 'true'
        run: echo '🔔 Nouveau titre publié dans Infos en temps réel. FCM sera branché ensuite.'
