name: VM RADIO - Détection nouvelles musiques par ID

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: vmradio-new-music-id-check
  cancel-in-progress: true

jobs:
  detect-new-music:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Vérifier la configuration AzuraCast
        env:
          AZURACAST_API_KEY: ${{ secrets.AZURACAST_API_KEY }}
        run: |
          if [ -z "${AZURACAST_API_KEY:-}" ]; then
            echo "Le secret AZURACAST_API_KEY n'est pas configuré dans ce dépôt."
            exit 1
          fi

      - name: Récupérer la bibliothèque AzuraCast
        env:
          AZURACAST_API_KEY: ${{ secrets.AZURACAST_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "X-API-Key: ${AZURACAST_API_KEY}" \
            -H 'Accept: application/json' \
            'https://radio.vmradio.fr/api/station/1/files/list?internal=true&rowCount=500&current=1&sortOrder=ASC&currentDirectory=' \
            -o azuracast-library.json

      - name: Détecter uniquement les nouveaux IDs
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          node <<'NODE'
          const fs = require('fs');

          const raw = JSON.parse(fs.readFileSync('azuracast-library.json', 'utf8'));
          const rows = Array.isArray(raw?.rows) ? raw.rows : Array.isArray(raw) ? raw : [];

          const normalize = row => {
            const media = row?.media || row || {};
            const id = String(media?.media_id ?? row?.media_id ?? row?.id ?? media?.id ?? '').trim();
            const title = String(media?.title ?? row?.title ?? row?.name ?? '').trim();
            const artist = String(media?.artist ?? row?.artist ?? '').trim();
            const filename = String(row?.path ?? row?.name ?? media?.path ?? media?.name ?? '').trim();
            const art = String(media?.art ?? media?.links?.art ?? row?.art ?? '').trim();
            return { id, title, artist, filename, art };
          };

          const current = rows.map(normalize).filter(x => x.id);
          const currentById = new Map(current.map(x => [x.id, x]));
          const currentIds = [...currentById.keys()].sort((a,b) => Number(a)-Number(b));

          const stateFile = 'data/known-music-ids.json';
          let previous = null;
          if (fs.existsSync(stateFile)) {
            try {
              const parsed = JSON.parse(fs.readFileSync(stateFile, 'utf8'));
              previous = Array.isArray(parsed?.ids) ? parsed.ids.map(String) : [];
            } catch {}
          }

          const state = {
            ids: currentIds,
            count: currentIds.length,
            updated_at: new Date().toISOString()
          };
          fs.writeFileSync(stateFile, JSON.stringify(state, null, 2) + '\n');

          if (previous === null) {
            fs.writeFileSync('data/new-music-detected.json', JSON.stringify({ initialized: true, new_tracks: [] }, null, 2) + '\n');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'initialized=true\nnew_count=0\n');
            console.log(`Initialisation : ${currentIds.length} ID(s) existants mémorisés, aucune notification envoyée.`);
            process.exit(0);
          }

          const known = new Set(previous);
          const fresh = currentIds.filter(id => !known.has(id)).map(id => currentById.get(id));
          fs.writeFileSync('data/new-music-detected.json', JSON.stringify({ initialized: false, new_tracks: fresh, checked_at: new Date().toISOString() }, null, 2) + '\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `initialized=false\nnew_count=${fresh.length}\n`);
          console.log(`Nouveaux IDs détectés : ${fresh.length}`);
          for (const track of fresh) console.log(`#${track.id} ${track.title} — ${track.artist}`);
          NODE

      - name: Enregistrer les IDs connus
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'VM RADIO Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/known-music-ids.json data/new-music-detected.json
          if git diff --cached --quiet; then
            echo 'Aucun changement d ID à enregistrer.'
          else
            git commit -m 'Mise à jour des IDs musicaux connus'
            git push
          fi

      - name: Déclencher les notifications des nouveaux IDs
        if: steps.detect.outputs.new_count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE' > /tmp/new-tracks.ndjson
          const fs = require('fs');
          const d = JSON.parse(fs.readFileSync('data/new-music-detected.json','utf8'));
          for (const track of d.new_tracks || []) console.log(JSON.stringify(track));
          NODE

          while IFS= read -r TRACK; do
            [ -z "$TRACK" ] && continue
            ID="$(node -e 'const x=JSON.parse(process.argv[1]);process.stdout.write(String(x.id||""))' "$TRACK")"
            TITLE="$(node -e 'const x=JSON.parse(process.argv[1]);process.stdout.write(String(x.title||"Nouvelle Musique"))' "$TRACK")"
            ARTIST="$(node -e 'const x=JSON.parse(process.argv[1]);process.stdout.write(String(x.artist||"Music IA By Valentin"))' "$TRACK")"
            gh api \
              --method POST \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "/repos/${GITHUB_REPOSITORY}/dispatches" \
              -f event_type='new_music' \
              -f "client_payload[id]=${ID}" \
              -f "client_payload[title]=${TITLE}" \
              -f "client_payload[artist]=${ARTIST}"
            echo "Notification demandée pour ID ${ID}: ${TITLE} — ${ARTIST}"
          done < /tmp/new-tracks.ndjson
