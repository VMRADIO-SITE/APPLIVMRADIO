<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#09020f">
<title>Télécharger l'application — VM RADIO</title>
<link rel="manifest" href="./manifest.webmanifest?v=11">
<link rel="icon" type="image/png" href="./favicon-64.png?v=11">
<link rel="apple-touch-icon" href="./apple-touch-icon.png?v=11">
<style>
:root{--bg:#050207;--purple:#8d35ff;--violet:#b45cff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#2b0750 0,#09020f 38%,#030104 100%);color:#fff;font-family:Arial,Helvetica,sans-serif}
.wrap{min-height:100vh;display:flex;justify-content:center;padding:28px 16px 50px}.page{width:min(100%,980px)}
.hero{border:2px solid #b45cff;border-radius:28px;padding:28px;background:linear-gradient(145deg,rgba(28,8,43,.96),rgba(5,2,8,.98));box-shadow:0 0 35px rgba(145,45,255,.42)}
.logo{width:150px;height:150px;object-fit:cover;display:block;margin:0 auto 15px;border-radius:25px}h1{margin:0;text-align:center;font-size:clamp(30px,6vw,58px);line-height:1;font-weight:900;text-transform:uppercase}h1 span{display:block;color:#d19aff;text-shadow:0 0 18px rgba(170,70,255,.8)}.subtitle{text-align:center;color:#eee;font-size:17px;margin:18px auto 0}
.platforms{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-top:28px}.platform{appearance:none;-webkit-appearance:none;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:205px;padding:20px 14px;border:1px solid rgba(197,126,255,.32);border-radius:20px;background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.025));color:#fff;transition:.2s;cursor:pointer;font:inherit}.platform:hover{transform:translateY(-3px);border-color:#b45cff;box-shadow:0 10px 30px rgba(141,53,255,.25)}.icon{width:62px;height:62px;display:block;margin-bottom:15px;fill:currentColor}.platform h2{margin:0;font-size:19px}.platform p{margin:8px 0 0;color:#cfc6d8;text-align:center;font-size:12px;line-height:1.45}.action{margin-top:14px;padding:8px 13px;border-radius:10px;background:#21102d;border:1px solid #9b43ff;color:#fff;font-size:11px;font-weight:800}
.continue{display:block;width:max-content;max-width:100%;margin:25px auto 0;text-decoration:none;color:#fff;background:#21102d;border:1px solid #a64cff;border-radius:13px;padding:12px 20px;font-weight:800}.note{text-align:center;color:#aaa;font-size:12px;margin-top:18px}
.modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(0,0,0,.78);backdrop-filter:blur(7px)}.modal.show{display:flex}.modal-box{width:min(100%,560px);max-height:90vh;overflow:auto;padding:26px;border:2px solid #b45cff;border-radius:24px;background:linear-gradient(145deg,#1c082b,#07040a);box-shadow:0 0 40px rgba(145,45,255,.5);text-align:center}.big-icon{font-size:52px;margin-bottom:8px}.modal-box h2{margin:0 0 8px;font-size:27px}.modal-box p{color:#ddd;font-size:15px;line-height:1.5}.steps{text-align:left;margin:18px 0;padding:16px 22px;border:1px solid rgba(197,126,255,.25);border-radius:15px;background:rgba(255,255,255,.035)}.steps li{margin:10px 0;color:#eee;line-height:1.5}
.install-now{display:none;border:0;border-radius:12px;padding:12px 22px;background:linear-gradient(135deg,#c05cff,#7433dd);color:#fff;font-weight:900;font-size:14px;cursor:pointer}.install-now.show{display:inline-block}.manual{margin-top:13px;padding:12px 14px;border-radius:12px;border:1px solid rgba(197,126,255,.25);background:rgba(255,255,255,.035);color:#ddd;font-size:13px;line-height:1.55;text-align:left}.manual strong{color:#d79aff}.close{margin-top:14px;border:1px solid #9b43ff;border-radius:11px;padding:10px 20px;background:#21102d;color:#fff;font-weight:800;cursor:pointer}
@media(max-width:800px){.platforms{grid-template-columns:repeat(2,1fr)}}@media(max-width:480px){.wrap{padding:16px 12px 40px}.hero{padding:20px 13px}.logo{width:125px;height:125px}.platforms{gap:10px}.platform{min-height:180px;padding:16px 8px}.platform h2{font-size:16px}.icon{width:52px;height:52px}.action{font-size:10px;padding:7px 10px}}
</style>
</head>
<body>
<div class="wrap"><main class="page">
<section class="hero">
<img class="logo" src="./vmradio-app-logo.png?v=11" alt="VM RADIO">
<h1>Télécharger<span>l'application</span></h1>
<p class="subtitle">VM RADIO — votre radio, partout avec vous.</p>
<div class="platforms">
<button class="platform" data-platform="ios"><div class="icon">🍎</div><h2>iPhone / iPad</h2><p>Safari → Partager →<br>Sur l'écran d'accueil</p><span class="action">Installer</span></button>
<button class="platform" data-platform="android"><div class="icon">🤖</div><h2>Android</h2><p>Chrome → Installer<br>ou Ajouter à l'écran d'accueil</p><span class="action">Installer</span></button>
<button class="platform" data-platform="windows"><div class="icon">🪟</div><h2>Windows</h2><p>Chrome ou Edge → installation VM RADIO</p><span class="action">Installer</span></button>
<button class="platform" data-platform="mac"><div class="icon">🍎</div><h2>Mac</h2><p>Safari, Chrome ou Edge → Installer VM RADIO</p><span class="action">Installer</span></button>
</div>
</section>
<a class="continue" href="./index.html">🎵 Ouvrir VM RADIO</a>
<p class="note">Page indépendante d'installation de VM RADIO.</p>
</main></div>
<div class="modal" id="modal"><div class="modal-box"><div class="big-icon" id="modalIcon"></div><h2 id="modalTitle"></h2><div id="modalText"></div><button class="install-now" id="installNow">⬇ Installer VM RADIO</button><div class="manual" id="manual"></div><br><button class="close" id="closeModal">Fermer</button></div></div>
<script>
let deferredPrompt=null,currentPlatform=null;
const modal=document.getElementById('modal'),title=document.getElementById('modalTitle'),icon=document.getElementById('modalIcon'),text=document.getElementById('modalText'),install=document.getElementById('installNow'),manual=document.getElementById('manual');
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;if(currentPlatform&&currentPlatform!=='ios'){install.classList.add('show');manual.innerHTML='<strong>Installation automatique disponible.</strong> Clique sur « Installer VM RADIO ». <span style="display:block;margin-top:6px;color:#aaa">Si tu préfères, tu peux aussi utiliser l’icône d’installation dans la barre d’adresse.</span>';}});
const data={
ios:{icon:'🍎',title:'Installer sur iPhone / iPad',html:'<p>Sur iPhone ou iPad, utilise Safari.</p><ol class="steps"><li>Ouvre cette page dans <b>Safari</b>.</li><li>Appuie sur <b>Partager ⬆️</b>.</li><li>Choisis <b>Sur l’écran d’accueil</b>.</li><li>Appuie sur <b>Ajouter</b>.</li></ol>'},
android:{icon:'🤖',title:'Installer sur Android',html:'<p>VM RADIO peut être installée comme une application.</p><ol class="steps"><li>Ouvre cette page dans <b>Chrome</b>.</li><li>Utilise <b>Installer l’application</b> si le navigateur le propose.</li><li>Sinon : menu <b>⋮</b> → <b>Ajouter à l’écran d’accueil</b>.</li></ol>'},
windows:{icon:'🪟',title:'Installer sur Windows',html:'<p>Sur Windows, utilise <b>Chrome</b> ou <b>Edge</b>.</p><ol class="steps"><li>Reste sur cette page dans <b>Chrome ou Edge</b>.</li><li>Cherche l’icône <b>Installer</b> dans la barre d’adresse.</li><li>Tu peux aussi ouvrir le menu <b>⋮</b> puis chercher <b>Installer VM RADIO</b>.</li><li>Confirme l’installation.</li></ol>'},
mac:{icon:'🍎',title:'Installer sur Mac',html:'<p>Sur Mac, utilise Safari, Chrome ou Edge.</p><ol class="steps"><li>Reste sur cette page.</li><li>Choisis <b>Ajouter au Dock</b> ou <b>Installer VM RADIO</b>.</li><li>Confirme l’installation.</li></ol>'}};
function refresh(){install.classList.remove('show');manual.innerHTML='';if(currentPlatform==='ios')return;if(deferredPrompt){install.classList.add('show');manual.innerHTML='<strong>Installation automatique disponible.</strong> Clique sur « Installer VM RADIO ». ';}else if(currentPlatform==='windows'){manual.innerHTML='<strong>Sur Windows :</strong> si le bouton automatique n’apparaît pas, clique sur <b>⋮</b> en haut à droite de Chrome/Edge et cherche <b>Installer VM RADIO</b>. Tu peux aussi utiliser l’icône d’installation à droite de la barre d’adresse.';}else{manual.innerHTML='<strong>Installation manuelle :</strong> utilise le menu d’installation de ton navigateur.';}}
document.querySelectorAll('.platform').forEach(btn=>btn.addEventListener('click',()=>{currentPlatform=btn.dataset.platform;const d=data[currentPlatform];icon.textContent=d.icon;title.textContent=d.title;text.innerHTML=d.html;modal.classList.add('show');refresh();}));
install.addEventListener('click',async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();const r=await deferredPrompt.userChoice;deferredPrompt=null;install.classList.remove('show');manual.innerHTML=r.outcome==='accepted'?'<strong>✅ VM RADIO est en cours d’installation.</strong>':'<strong>Installation annulée.</strong>'});
document.getElementById('closeModal').onclick=()=>modal.classList.remove('show');modal.addEventListener('click',e=>{if(e.target===modal)modal.classList.remove('show')});
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js?v=11',{updateViaCache:'none'}).catch(()=>{});
</script>
</body></html>
