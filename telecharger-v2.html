<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#09020f">
<title>Télécharger l'application — VM RADIO</title>
<link rel="manifest" href="./manifest.webmanifest?v=16">
<link rel="icon" type="image/png" href="./favicon-64.png?v=16">
<link rel="apple-touch-icon" href="./apple-touch-icon.png?v=16">
<style>body{margin:0;background:#09020f;color:#fff;font-family:Arial,sans-serif}.wrap{min-height:100vh;display:flex;justify-content:center;padding:28px 16px}.page{width:min(100%,980px)}.hero{border:2px solid #b45cff;border-radius:28px;padding:28px;background:#0d0615}.logo{width:150px;height:150px;object-fit:cover;display:block;margin:0 auto 15px;border-radius:25px}h1{text-align:center;font-size:clamp(30px,6vw,58px);margin:0;text-transform:uppercase}h1 span{display:block;color:#d19aff}.subtitle{text-align:center;color:#eee;font-size:17px}.platforms{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-top:28px}.platform{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:205px;padding:20px 14px;border:1px solid #553065;border-radius:20px;background:#100916;color:#fff;cursor:pointer;font:inherit}.icon{font-size:52px;margin-bottom:15px}.platform h2{margin:0;font-size:19px}.platform p{text-align:center;font-size:12px;color:#cfc6d8}.action{margin-top:14px;padding:8px 13px;border-radius:10px;background:#21102d;border:1px solid #9b43ff;font-size:11px;font-weight:800}.continue{display:block;width:max-content;margin:25px auto 0;color:#fff;text-decoration:none;background:#21102d;border:1px solid #a64cff;border-radius:13px;padding:12px 20px}.note{text-align:center;color:#aaa;font-size:12px}.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(0,0,0,.78);z-index:100}.modal.show{display:flex}.modal-box{width:min(100%,560px);padding:26px;border:2px solid #b45cff;border-radius:24px;background:#12071a;text-align:center}.big-icon{font-size:52px}.steps{text-align:left;padding:16px 22px;border:1px solid #4c3158;border-radius:15px}.install-now{display:inline-block;border:0;border-radius:12px;padding:12px 22px;background:linear-gradient(135deg,#c05cff,#7433dd);color:#fff;font-weight:900;cursor:pointer;margin-top:8px}.manual{margin-top:13px;padding:12px 14px;border-radius:12px;border:1px solid #4c3158;background:#0d0811;color:#ddd;font-size:13px;line-height:1.55;text-align:left}.close{margin-top:14px;border:1px solid #9b43ff;border-radius:11px;padding:10px 20px;background:#21102d;color:#fff;font-weight:800;cursor:pointer}@media(max-width:800px){.platforms{grid-template-columns:repeat(2,1fr)}}@media(max-width:480px){.platforms{grid-template-columns:1fr}.logo{width:125px;height:125px}}</style>
</head>
<body>
<div class="wrap"><main class="page"><section class="hero">
<img class="logo" src="./vmradio-app-logo.png?v=16" alt="VM RADIO"><h1>Télécharger<span>l'application</span></h1><p class="subtitle">VM RADIO — votre radio, partout avec vous.</p>
<div class="platforms">
<button class="platform" data-platform="ios"><div class="icon">🍎</div><h2>iPhone / iPad</h2><p>Safari → Partager →<br>Sur l'écran d'accueil</p><span class="action">Installer</span></button>
<button class="platform" data-platform="android"><div class="icon">🤖</div><h2>Android</h2><p>Chrome → Installer<br>ou Ajouter à l'écran d'accueil</p><span class="action">Installer</span></button>
<button class="platform" data-platform="windows"><div class="icon">🪟</div><h2>Windows</h2><p>Chrome ou Edge → installation VM RADIO</p><span class="action">Installer</span></button>
<button class="platform" data-platform="mac"><div class="icon">🍎</div><h2>Mac</h2><p>Safari, Chrome ou Edge → Installer VM RADIO</p><span class="action">Installer</span></button>
</div></section><a class="continue" href="https://vmradio.fr/">🎵 Ouvrir VM RADIO</a><p class="note">Page indépendante d'installation de VM RADIO.</p></main></div>
<div class="modal" id="modal"><div class="modal-box"><div class="big-icon" id="modalIcon"></div><h2 id="modalTitle"></h2><div id="modalText"></div><button class="install-now" id="installNow">⬇ Installer VM RADIO</button><div class="manual" id="manual"></div><br><button class="close" id="closeModal">Fermer</button></div></div>
<script>
let deferredPrompt=null,currentPlatform=null;
const modal=document.getElementById('modal'),title=document.getElementById('modalTitle'),icon=document.getElementById('modalIcon'),text=document.getElementById('modalText'),install=document.getElementById('installNow'),manual=document.getElementById('manual');
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;refresh()});
const data={ios:{icon:'🍎',title:'Installer sur iPhone / iPad',html:'<p>Sur iPhone ou iPad, utilise Safari.</p><ol class="steps"><li>Ouvre cette page dans <b>Safari</b>.</li><li>Appuie sur <b>Partager ⬆️</b>.</li><li>Choisis <b>Sur l’écran d’accueil</b>.</li><li>Appuie sur <b>Ajouter</b>.</li></ol>'},android:{icon:'🤖',title:'Installer sur Android',html:'<p>VM RADIO peut être installée comme une application.</p><ol class="steps"><li>Ouvre cette page dans <b>Chrome</b>.</li><li>Utilise <b>Installer l’application</b> si le navigateur le propose.</li><li>Sinon : menu <b>⋮</b> → <b>Ajouter à l’écran d’accueil</b>.</li></ol>'},windows:{icon:'🪟',title:'Installer sur Windows',html:'<p>Sur Windows, utilise <b>Chrome</b> ou <b>Edge</b>.</p><ol class="steps"><li>Reste sur cette page.</li><li>Si l’icône d’installation apparaît dans la barre d’adresse, clique dessus.</li><li>Sinon, ouvre <b>⋮</b> puis cherche <b>Installer VM RADIO</b>.</li><li>Confirme l’installation.</li></ol>'},mac:{icon:'🍎',title:'Installer sur Mac',html:'<p>Sur Mac, utilise Safari, Chrome ou Edge.</p><ol class="steps"><li>Reste sur cette page.</li><li>Choisis <b>Ajouter au Dock</b> ou <b>Installer VM RADIO</b>.</li><li>Confirme l’installation.</li></ol>'}};
function refresh(){if(deferredPrompt){manual.innerHTML='<strong>Installation automatique disponible.</strong> Clique sur « Installer VM RADIO ». ';}else if(currentPlatform==='windows'){manual.innerHTML='<strong>Windows :</strong> le bouton reste visible. Si Chrome/Edge ne fournit pas encore le lancement automatique, utilise le menu ⋮ → <b>Installer VM RADIO</b>.';}else if(currentPlatform!=='ios'){manual.innerHTML='<strong>Installation :</strong> si le bouton automatique n’est pas disponible, utilise le menu d’installation de ton navigateur.';}else{manual.innerHTML='<strong>iPhone/iPad :</strong> utilise Partager ⬆️ → Sur l’écran d’accueil → Ajouter.';}}
document.querySelectorAll('.platform').forEach(btn=>btn.addEventListener('click',()=>{currentPlatform=btn.dataset.platform;const d=data[currentPlatform];icon.textContent=d.icon;title.textContent=d.title;text.innerHTML=d.html;modal.classList.add('show');refresh()}));
install.addEventListener('click',async()=>{if(deferredPrompt){deferredPrompt.prompt();const r=await deferredPrompt.userChoice;deferredPrompt=null;refresh();manual.innerHTML=r.outcome==='accepted'?'<strong>✅ VM RADIO est en cours d’installation.</strong>':'<strong>Installation annulée.</strong>';}else{manual.innerHTML=currentPlatform==='windows'?'<strong>Pour Windows :</strong> ouvre Chrome/Edge → menu ⋮ → <b>Installer VM RADIO</b>. Le navigateur doit autoriser l’installation PWA pour lancer la fenêtre automatiquement.': '<strong>Le navigateur ne propose pas encore l’installation automatique.</strong> Utilise son menu « Installer » ou « Ajouter à l’écran d’accueil ». ';}});
document.getElementById('closeModal').onclick=()=>modal.classList.remove('show');modal.addEventListener('click',e=>{if(e.target===modal)modal.classList.remove('show')});
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js?v=16',{updateViaCache:'none'}).catch(()=>{});
</script>
</body></html>
