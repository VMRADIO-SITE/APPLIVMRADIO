<!doctype html>

<head>

<title>Télécharger l'application — VM RADIO</title>
<link rel="manifest" href="./manifest.webmanifest?v=18">

<style>
:root{--bg:#07030b;--panel:#12091b;--purple:#b45cff;--pink:#d19aff;--line:#513065}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 0,#35105a 0,#0b0411 40%,#030104 100%);color:#fff;font-family:Arial,Helvetica,sans-serif}body{min-height:100vh}.wrap{min-height:100vh;display:flex;justify-content:center;padding:28px 16px 50px}.page{width:min(100%,980px)}.hero{border:2px solid var(--purple);border-radius:28px;padding:28px;background:linear-gradient(145deg,rgba(29,8,44,.97),rgba(5,2,8,.98));box-shadow:0 0 35px rgba(145,45,255,.35)}.logo{width:150px;height:150px;object-fit:cover;display:block;margin:0 auto 16px;border-radius:25px}h1{margin:0;text-align:center;font-size:clamp(30px,6vw,58px);line-height:1;text-transform:uppercase;font-weight:900}h1 span{display:block;color:var(--pink);text-shadow:0 0 18px rgba(170,70,255,.7)}.subtitle{text-align:center;color:#eee;font-size:17px;margin:18px auto 0}.platforms{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-top:28px}.platform{appearance:none;-webkit-appearance:none;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:205px;padding:20px 14px;border:1px solid rgba(197,126,255,.32);border-radius:20px;background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.025));color:#fff;cursor:pointer;font:inherit;transition:.2s}.platform:hover{transform:translateY(-3px);border-color:var(--purple);box-shadow:0 10px 30px rgba(141,53,255,.25)}.icon{width:58px;height:58px;display:block;margin-bottom:15px;fill:currentColor}.platform h2{margin:0;font-size:19px}.platform p{margin:8px 0 0;color:#cfc6d8;text-align:center;font-size:12px;line-height:1.45}.action{margin-top:14px;padding:8px 13px;border-radius:10px;background:#21102d;border:1px solid #9b43ff;color:#fff;font-size:11px;font-weight:800}.continue{display:block;width:max-content;max-width:100%;margin:25px auto 0;text-decoration:none;color:#fff;background:#21102d;border:1px solid #a64cff;border-radius:13px;padding:12px 20px;font-weight:800}.note{text-align:center;color:#aaa;font-size:12px;margin-top:18px}.modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(0,0,0,.78);backdrop-filter:blur(7px)}.modal.show{display:flex}.modal-box{width:min(100%,560px);max-height:90vh;overflow:auto;padding:25px;border:2px solid var(--purple);border-radius:24px;background:linear-gradient(145deg,#1c082b,#07040a);box-shadow:0 0 40px rgba(145,45,255,.5);text-align:center}.big-icon{font-size:50px}.modal-box h2{margin:5px 0 8px;font-size:25px}.modal-box p{color:#ddd;line-height:1.5}.steps{text-align:left;margin:18px 0;padding:16px 22px;border:1px solid rgba(197,126,255,.25);border-radius:15px;background:rgba(255,255,255,.035)}.steps li{margin:9px 0;line-height:1.45}.install-now{display:inline-block;border:0;border-radius:12px;padding:12px 22px;background:linear-gradient(135deg,#c05cff,#7433dd);color:#fff;font-weight:900;cursor:pointer;margin-top:8px}.manual{margin-top:13px;padding:12px 14px;border-radius:12px;border:1px solid #4c3158;background:#0d0811;color:#ddd;font-size:13px;line-height:1.55;text-align:left}.close{margin-top:14px;border:1px solid #9b43ff;border-radius:11px;padding:10px 20px;background:#21102d;color:#fff;font-weight:800;cursor:pointer}@media(max-width:800px){.platforms{grid-template-columns:repeat(2,1fr)}}@media(max-width:480px){.wrap{padding:16px 12px 40px}.hero{padding:20px 13px}.logo{width:125px;height:125px}.platforms{grid-template-columns:1fr;gap:10px}.platform{min-height:180px}}
</style>
</head>
<body>
<div class="wrap"><main class="page"><section class="hero">
<img class="logo" src="./vmradio-app-logo.png?v=18" alt="VM RADIO">
<h1>Télécharger<span>l'application</span></h1>
<p class="subtitle">VM RADIO — votre radio, partout avec vous.</p>
<div class="platforms">
<button class="platform" data-platform="ios"><svg class="icon" viewBox="0 0 64 64"><path d="M42.7 33.7c0-6.4 5.2-9.5 5.4-9.6-3-4.4-7.7-5-9.4-5.1-4-.4-7.8 2.4-9.8 2.4-2 0-5.1-2.4-8.4-2.3-4.3.1-8.3 2.5-10.5 6.4-4.5 7.8-1.1 19.4 3.2 25.8 2.1 3.1 4.6 6.5 7.9 6.4 3.2-.1 4.4-2.1 8.3-2.1 3.9 0 5 2.1 8.4 2 3.5-.1 5.7-3.1 7.8-6.2 2.4-3.6 3.4-7.1 3.5-7.3-.1 0-6.7-2.6-6.7-10.4zM36.3 14.8c1.8-2.2 3-5.2 2.7-8.2-2.6.1-5.7 1.8-7.5 4-1.6 1.9-3.1 5-2.7 7.9 2.9.2 5.7-1.5 7.5-3.7z"/></svg><h2>iPhone / iPad</h2><p>Safari → Partager →<br>Sur l'écran d'accueil</p><span class="action">Installer</span></button>
<button class="platform" data-platform="android"><svg class="icon" viewBox="0 0 64 64"><path d="M20.2 18.4 16.6 12.3l1.8-1 3.8 6.5a21.3 21.3 0 0 1 20 0L46 11.3l1.8 1-3.6 6.1A19.8 19.8 0 0 1 52 34.7H12a19.8 19.8 0 0 1 8.2-16.3ZM22 28.4a2.1 2.1 0 1 0 0-4.2 2.1 2.1 0 0 0 0 4.2Zm20 0a2.1 2.1 0 1 0 0-4.2 2.1 2.1 0 0 0 0 4.2ZM12 36h40v10.2a4.1 4.1 0 0 1-4.1 4.1H45V56h-4v-5.7H23V56h-4v-5.7h-2.9a4.1 4.1 0 0 1-4.1-4.1V36Z"/></svg><h2>Android</h2><p>Chrome → Installer<br>ou Ajouter à l'écran d'accueil</p><span class="action">Installer</span></button>
<button class="platform" data-platform="windows"><svg class="icon" viewBox="0 0 64 64"><path d="M5 10 29 6.5v24.8H5V10Zm29-4.1L59 2v29.3H34V5.9ZM5 34.7h24v24.8L5 56V34.7Zm29 0h25v29.3l-25-3.9V34.7Z"/></svg><h2>Windows</h2><p>Chrome ou Edge → installation VM RADIO</p><span class="action">Installer</span></button>
<button class="platform" data-platform="mac"><svg class="icon" viewBox="0 0 64 64"><path d="M42.7 33.7c0-6.4 5.2-9.5 5.4-9.6-3-4.4-7.7-5-9.4-5.1-4-.4-7.8 2.4-9.8 2.4-2 0-5.1-2.4-8.4-2.3-4.3.1-8.3 2.5-10.5 6.4-4.5 7.8-1.1 19.4 3.2 25.8 2.1 3.1 4.6 6.5 7.9 6.4 3.2-.1 4.4-2.1 8.3-2.1 3.9 0 5 2.1 8.4 2 3.5-.1 5.7-3.1 7.8-6.2 2.4-3.6 3.4-7.1 3.5-7.3-.1 0-6.7-2.6-6.7-10.4zM36.3 14.8c1.8-2.2 3-5.2 2.7-8.2-2.6.1-5.7 1.8-7.5 4-1.6 1.9-3.1 5-2.7 7.9 2.9.2 5.7-1.5 7.5-3.7z"/></svg><h2>Mac</h2><p>Safari, Chrome ou Edge → Installer VM RADIO</p><span class="action">Installer</span></button>
</div></section><a class="continue" href="./index.html">🎵 Ouvrir VM RADIO</a><p class="note">Page d'installation VM RADIO — version actualisée.</p></main></div>
<div class="modal" id="modal"><div class="modal-box"><div class="big-icon" id="modalIcon"></div><h2 id="modalTitle"></h2><div id="modalText"></div><button class="install-now" id="installNow">⬇ Installer VM RADIO</button><div class="manual" id="manual"></div><button class="close" id="closeModal">Fermer</button></div></div>
<script>
let deferredPrompt=null,currentPlatform=null;
const modal=document.getElementById('modal'),title=document.getElementById('modalTitle'),icon=document.getElementById('modalIcon'),text=document.getElementById('modalText'),install=document.getElementById('installNow'),manual=document.getElementById('manual');
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;refresh()});
const data={ios:{icon:'🍎',title:'Installer sur iPhone / iPad',html:'<p>Sur iPhone ou iPad, utilise Safari.</p><ol class="steps"><li>Ouvre cette page dans <b>Safari</b>.</li><li>Appuie sur <b>Partager ⬆️</b>.</li><li>Choisis <b>Sur l’écran d’accueil</b>.</li><li>Appuie sur <b>Ajouter</b>.</li></ol>'},android:{icon:'🤖',title:'Installer sur Android',html:'<p>VM RADIO peut être installée comme une application.</p><ol class="steps"><li>Ouvre cette page dans <b>Chrome</b>.</li><li>Utilise <b>Installer l’application</b> si le navigateur le propose.</li><li>Sinon : menu <b>⋮</b> → <b>Ajouter à l’écran d’accueil</b>.</li></ol>'},windows:{icon:'🪟',title:'Installer sur Windows',html:'<p>Sur Windows, utilise <b>Chrome</b> ou <b>Edge</b>.</p><ol class="steps"><li>Reste sur cette page.</li><li>Si l’icône d’installation apparaît dans la barre d’adresse, clique dessus.</li><li>Sinon, ouvre <b>⋮</b> puis cherche <b>Installer VM RADIO</b>.</li><li>Confirme l’installation.</li></ol>'},mac:{icon:'🍎',title:'Installer sur Mac',html:'<p>Sur Mac, utilise Safari, Chrome ou Edge.</p><ol class="steps"><li>Reste sur cette page.</li><li>Choisis <b>Ajouter au Dock</b> ou <b>Installer VM RADIO</b>.</li><li>Confirme l’installation.</li></ol>'}};
function refresh(){if(deferredPrompt){manual.innerHTML='<strong>Installation automatique disponible.</strong> Clique sur « Installer VM RADIO ». ';}else if(currentPlatform==='ios'){manual.innerHTML='<strong>iPhone/iPad :</strong> Partager ⬆️ → Sur l’écran d’accueil → Ajouter.';}else{manual.innerHTML='<strong>Installation :</strong> si le bouton automatique n’est pas disponible, utilise le menu d’installation du navigateur.';}}
document.querySelectorAll('.platform').forEach(btn=>btn.addEventListener('click',()=>{currentPlatform=btn.dataset.platform;const d=data[currentPlatform];icon.textContent=d.icon;title.textContent=d.title;text.innerHTML=d.html;modal.classList.add('show');refresh()}));
install.addEventListener('click',async()=>{if(deferredPrompt){deferredPrompt.prompt();const r=await deferredPrompt.userChoice;deferredPrompt=null;manual.innerHTML=r.outcome==='accepted'?'<strong>✅ VM RADIO est en cours d’installation.</strong>':'<strong>Installation annulée.</strong>';return;}manual.innerHTML=currentPlatform==='windows'?'<strong>Windows :</strong> ouvre Chrome/Edge → menu ⋮ → <b>Installer VM RADIO</b> ou utilise l’icône d’installation dans la barre d’adresse.':'<strong>Le navigateur ne propose pas encore l’installation automatique.</strong> Utilise son menu « Installer » ou « Ajouter à l’écran d’accueil ». ';});
document.getElementById('closeModal').onclick=()=>modal.classList.remove('show');modal.addEventListener('click',e=>{if(e.target===modal)modal.classList.remove('show')});
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js?v=18',{updateViaCache:'none'}).then(reg=>reg.update()).catch(()=>{});
</script>
</body></html>
