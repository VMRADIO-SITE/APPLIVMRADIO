<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09020f">
<meta name="description" content="Télécharger et installer l'application VM RADIO.">
<link rel="manifest" href="./manifest.webmanifest?v=21">
<link rel="icon" href="./favicon-64.png?v=21">
<link rel="apple-touch-icon" href="./apple-touch-icon.png?v=21">
<title>Télécharger l'application — VM RADIO</title>
<style>
:root{color-scheme:dark;--bg:#07020d;--panel:#11081b;--panel2:#170b24;--line:#5e2a7d;--violet:#b85cff;--violet2:#7b35dc;--text:#fff;--muted:#c9bfd2}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#24103a 0,#0d0415 42%,#07020d 100%);font-family:Arial,Helvetica,sans-serif;color:var(--text)}
.page{width:min(1080px,100%);margin:auto;padding:18px 18px 38px}.hero{text-align:center;padding:20px 18px 14px}.logo{width:96px;height:96px;object-fit:cover;border-radius:22px;display:block;margin:0 auto 15px;box-shadow:0 0 28px #8d42b855}h1{margin:0;font-size:clamp(26px,4.5vw,42px);font-weight:900;letter-spacing:-.6px;text-transform:uppercase;line-height:1.05}h1 span{display:block;color:#d39aff}.intro{max-width:560px;margin:10px auto 0;color:var(--muted);font-size:14px;line-height:1.45}
.platforms{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:22px}.platform{appearance:none;width:100%;min-height:210px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(160deg,#190c25,#0e0615);color:#fff;padding:20px 14px;cursor:pointer;text-align:center;transition:transform .18s,border-color .18s,box-shadow .18s}.platform:hover,.platform:focus-visible{transform:translateY(-4px);border-color:var(--violet);box-shadow:0 12px 35px #0008;outline:none}.platform-icon{height:46px;display:flex;align-items:center;justify-content:center;margin-bottom:12px}.platform-icon svg{width:42px;height:42px;display:block;fill:currentColor}.platform h2{margin:0 0 8px;font-size:17px}.platform p{margin:0;color:var(--muted);font-size:12px;line-height:1.45}.choose{display:inline-block;margin-top:14px;padding:8px 14px;border-radius:11px;background:#21102f;border:1px solid #9d4de0;font-size:11px;font-weight:800}
.bottom{text-align:center;margin-top:22px}.home{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;color:#fff;padding:11px 20px;border-radius:13px;background:linear-gradient(135deg,var(--violet),var(--violet2));font-weight:900;font-size:14px;box-shadow:0 8px 28px #7b35dc44}.small{margin:11px 0 0;color:#8e8498;font-size:11px}
.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:18px;background:#000b;z-index:50}.overlay.open{display:flex}.dialog{width:min(600px,100%);max-height:min(90vh,760px);overflow:auto;background:linear-gradient(160deg,#1b0b27,#0d0513);border:2px solid var(--violet);border-radius:26px;padding:25px;box-shadow:0 20px 70px #000b}.dialog-head{text-align:center}.dialog-icon{height:48px;display:flex;align-items:center;justify-content:center}.dialog-icon svg{width:42px;height:42px;fill:currentColor}.dialog h2{margin:10px 0 5px;font-size:25px}.dialog-sub{margin:0;color:var(--muted)}.steps{margin:22px 0 0;padding:18px 20px;border:1px solid #543463;border-radius:17px;background:#0a050e}.steps ol{margin:0;padding-left:22px}.steps li{padding:7px 0;line-height:1.45}.install{width:100%;margin-top:18px;border:0;border-radius:14px;padding:14px 18px;background:linear-gradient(135deg,#c35cff,#7633d6);color:#fff;font-size:15px;font-weight:900;cursor:pointer}.status{margin-top:13px;padding:13px;border:1px solid #4b3158;border-radius:14px;color:#ddd;background:#0a050e;line-height:1.5;font-size:13px}.close{display:block;margin:15px auto 0;border:1px solid #8743ae;background:#1c0d27;color:#fff;border-radius:12px;padding:10px 22px;font-weight:800;cursor:pointer}
@media(max-width:850px){.platforms{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){.page{padding:10px 12px 30px}.hero{padding:18px 8px 12px}.logo{width:84px;height:84px}.platforms{grid-template-columns:1fr}.platform{min-height:190px}.dialog{padding:20px}.dialog h2{font-size:22px}}
</style>
</head>
<body>
<main class="page">
<section class="hero">
<img class="logo" src="./vmradio-app-icon-512.png?v=21" alt="VM RADIO">
<h1>Télécharger<span>l'application</span></h1>
<p class="intro">Installe VM RADIO sur ton appareil et retrouve ta radio directement depuis ton écran d'accueil.</p>
</section>
<section class="platforms" aria-label="Choisir un appareil">
<button class="platform" data-platform="ios"><div class="platform-icon"><svg viewBox="0 0 24 24" aria-label="Apple"><path d="M16.7 12.7c0-2.2 1.8-3.3 1.9-3.4-1-1.5-2.6-1.7-3.2-1.7-1.4-.1-2.8.8-3.5.8-.7 0-1.8-.8-3-.8-1.5 0-2.9.9-3.7 2.2-1.6 2.7-.4 6.7 1.1 8.9.8 1.1 1.6 2.3 2.8 2.2 1.1 0 1.6-.7 3-.7s1.8.7 3 .7c1.2 0 2-.1 2.8-1.3.9-1.3 1.3-2.6 1.3-2.7-.1 0-2.5-1-2.5-4.2zM14.5 6.2c.6-.8 1-1.9.9-3-.9 0-2 .6-2.6 1.4-.6.7-1 1.8-.9 2.8 1 .1 2-.5 2.6-1.2z"/></svg></div><h2>iPhone / iPad</h2><p>Installation depuis Safari avec « Sur l'écran d'accueil ».</p><span class="choose">Voir l'installation</span></button>
<button class="platform" data-platform="android"><div class="platform-icon"><svg viewBox="0 0 24 24" aria-label="Android"><path d="M7.2 9.2v8.1c0 .6.5 1.1 1.1 1.1h.8v2.4c0 .6.5 1.1 1.1 1.1s1.1-.5 1.1-1.1v-2.4h1.4v2.4c0 .6.5 1.1 1.1 1.1s1.1-.5 1.1-1.1v-2.4h.8c.6 0 1.1-.5 1.1-1.1V9.2H7.2zM5.8 9.2c-.6 0-1.1.5-1.1 1.1v6.3c0 .6.5 1.1 1.1 1.1s1.1-.5 1.1-1.1v-6.3c0-.6-.5-1.1-1.1-1.1zm12.4 0c-.6 0-1.1.5-1.1 1.1v6.3c0 .6.5 1.1 1.1 1.1s1.1-.5 1.1-1.1v-6.3c0-.6-.5-1.1-1.1-1.1zM8 8.2h8c-.2-1.5-1-2.7-2.1-3.5l.9-1.4c.2-.3.1-.6-.2-.8-.3-.2-.6-.1-.8.2l-.9 1.4c-.6-.2-1.2-.3-1.9-.3s-1.3.1-1.9.3l-.9-1.4c-.2-.3-.5-.4-.8-.2-.3.2-.4.5-.2.8l.9 1.4C9 5.5 8.2 6.7 8 8.2zm2.3-2.1c-.3 0-.6-.3-.6-.6s.3-.6.6-.6.6.3.6.6-.3.6-.6.6zm3.4 0c-.3 0-.6-.3-.6-.6s.3-.6.6-.6.6.3.6.6-.3.6-.6.6z"/></svg></div><h2>Android</h2><p>Installation depuis Chrome avec l'option d'installation de l'application.</p><span class="choose">Voir l'installation</span></button>
<button class="platform" data-platform="windows"><div class="platform-icon"><svg viewBox="0 0 24 24" aria-label="Windows"><path d="M2 4.2 10.5 3v8H2V4.2zm10  -1.4L22 1.4V11h-10V2.8zM2 13h8.5v8L2 19.8V13zm10 0h10v9.6L12 21.2V13z"/></svg></div><h2>Windows</h2><p>Installation avec Chrome ou Microsoft Edge.</p><span class="choose">Voir l'installation</span></button>
<button class="platform" data-platform="mac"><div class="platform-icon"><svg viewBox="0 0 24 24" aria-label="Mac"><path d="M16.7 12.7c0-2.2 1.8-3.3 1.9-3.4-1-1.5-2.6-1.7-3.2-1.7-1.4-.1-2.8.8-3.5.8-.7 0-1.8-.8-3-.8-1.5 0-2.9.9-3.7 2.2-1.6 2.7-.4 6.7 1.1 8.9.8 1.1 1.6 2.3 2.8 2.2 1.1 0 1.6-.7 3-.7s1.8.7 3 .7c1.2 0 2-.1 2.8-1.3.9-1.3 1.3-2.6 1.3-2.7-.1 0-2.5-1-2.5-4.2zM14.5 6.2c.6-.8 1-1.9.9-3-.9 0-2 .6-2.6 1.4-.6.7-1 1.8-.9 2.8 1 .1 2-.5 2.6-1.2z"/></svg></div><h2>Mac</h2><p>Installation avec Safari, Chrome ou Edge selon ton navigateur.</p><span class="choose">Voir l'installation</span></button>
</section>
<div class="bottom"><a class="home" href="https://vmradio.fr/">🎵 Ouvrir VM RADIO</a><p class="small">VM RADIO · Application officielle</p></div>
</main>
<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><div class="dialog"><div class="dialog-head"><div class="dialog-icon" id="dialogIcon"></div><h2 id="dialogTitle"></h2><p class="dialog-sub" id="dialogSub"></p></div><div class="steps" id="steps"></div><button class="install" id="install">⬇ Installer VM RADIO</button><div class="status" id="status"></div><button class="close" id="close">Fermer</button></div></div>
<script>
let deferredPrompt=null,platform='';
const overlay=document.getElementById('overlay'),icon=document.getElementById('dialogIcon'),title=document.getElementById('dialogTitle'),sub=document.getElementById('dialogSub'),steps=document.getElementById('steps'),install=document.getElementById('install'),status=document.getElementById('status');
const icons={ios:'<svg viewBox="0 0 24 24"><path d="M16.7 12.7c0-2.2 1.8-3.3 1.9-3.4-1-1.5-2.6-1.7-3.2-1.7-1.4-.1-2.8.8-3.5.8-.7 0-1.8-.8-3-.8-1.5 0-2.9.9-3.7 2.2-1.6 2.7-.4 6.7 1.1 8.9.8 1.1 1.6 2.3 2.8 2.2 1.1 0 1.6-.7 3-.7s1.8.7 3 .7c1.2 0 2-.1 2.8-1.3.9-1.3 1.3-2.6 1.3-2.7-.1 0-2.5-1-2.5-4.2zM14.5 6.2c.6-.8 1-1.9.9-3-.9 0-2 .6-2.6 1.4-.6.7-1 1.8-.9 2.8 1 .1 2-.5 2.6-1.2z"/></svg>',android:'<svg viewBox="0 0 24 24"><path d="M7.2 9.2v8.1c0 .6.5 1.1 1.1 1.1h.8v2.4c0 .6.5 1.1 1.1 1.1s1.1-.5 1.1-1.1v-2.4h1.4v2.4c0 .6.5 1.1 1.1 1.1s1.1-.5 1.1-1.1v-2.4h.8c.6 0 1.1-.5 1.1-1.1V9.2H7.2zM5.8 9.2c-.6 0-1.1.5-1.1 1.1v6.3c0 .6.5 1.1 1.1 1.1s1.1-.5 1.1-1.1v-6.3c0-.6-.5-1.1-1.1-1.1zm12.4 0c-.6 0-1.1.5-1.1 1.1v6.3c0 .6.5 1.1 1.1 1.1s1.1-.5 1.1-1.1v-6.3c0-.6-.5-1.1-1.1-1.1zM8 8.2h8c-.2-1.5-1-2.7-2.1-3.5l.9-1.4c.2-.3.1-.6-.2-.8-.3-.2-.6-.1-.8.2l-.9 1.4c-.6-.2-1.2-.3-1.9-.3s-1.3.1-1.9.3l-.9-1.4c-.2-.3-.5-.4-.8-.2-.3.2-.4.5-.2.8l.9 1.4C9 5.5 8.2 6.7 8 8.2z"/></svg>',windows:'<svg viewBox="0 0 24 24"><path d="M2 4.2 10.5 3v8H2V4.2zm10-1.4L22 1.4V11H12V2.8zM2 13h8.5v8L2 19.8V13zm10 0h10v9.6L12 21.2V13z"/></svg>',mac:'<svg viewBox="0 0 24 24"><path d="M16.7 12.7c0-2.2 1.8-3.3 1.9-3.4-1-1.5-2.6-1.7-3.2-1.7-1.4-.1-2.8.8-3.5.8-.7 0-1.8-.8-3-.8-1.5 0-2.9.9-3.7 2.2-1.6 2.7-.4 6.7 1.1 8.9.8 1.1 1.6 2.3 2.8 2.2 1.1 0 1.6-.7 3-.7s1.8.7 3 .7c1.2 0 2-.1 2.8-1.3.9-1.3 1.3-2.6 1.3-2.7-.1 0-2.5-1-2.5-4.2zM14.5 6.2c.6-.8 1-1.9.9-3-.9 0-2 .6-2.6 1.4-.6.7-1 1.8-.9 2.8 1 .1 2-.5 2.6-1.2z"/></svg>'};
const info={ios:{title:'iPhone / iPad',sub:'Installation avec Safari',steps:'<ol><li>Ouvre cette page dans <b>Safari</b>.</li><li>Appuie sur le bouton <b>Partager ⬆️</b>.</li><li>Choisis <b>Sur l’écran d’accueil</b>.</li><li>Appuie sur <b>Ajouter</b>.</li></ol>',status:'Sur iPhone et iPad, l’installation se fait depuis le menu Partager de Safari.'},android:{title:'Android',sub:'Installation avec Chrome',steps:'<ol><li>Ouvre cette page dans <b>Chrome</b>.</li><li>Appuie sur <b>Installer l’application</b> si Chrome le propose.</li><li>Sinon ouvre le menu <b>⋮</b> puis <b>Ajouter à l’écran d’accueil</b>.</li><li>Confirme l’installation.</li></ol>',status:'Si le bouton d’installation automatique n’est pas disponible, utilise le menu de Chrome.'},windows:{title:'Windows',sub:'Installation avec Chrome ou Edge',steps:'<ol><li>Reste sur cette page dans <b>Chrome</b> ou <b>Edge</b>.</li><li>Repère l’icône d’installation dans la barre d’adresse, si elle apparaît.</li><li>Sinon ouvre le menu <b>⋮</b> puis <b>Installer VM RADIO</b>.</li><li>Confirme l’installation.</li></ol>',status:'Le bouton ci-dessous lance l’installation automatique lorsque le navigateur la propose.'},mac:{title:'Mac',sub:'Installation avec Safari, Chrome ou Edge',steps:'<ol><li>Reste sur cette page dans ton navigateur.</li><li>Avec Chrome/Edge, ouvre le menu et choisis <b>Installer VM RADIO</b> si disponible.</li><li>Avec Safari, utilise l’option d’ajout à l’écran d’accueil ou au Dock lorsqu’elle est proposée.</li><li>Confirme l’installation.</li></ol>',status:'La disponibilité de l’installation automatique dépend du navigateur utilisé.'}};
function updateInstall(){install.style.display='block';if(deferredPrompt){status.textContent='✅ Installation automatique disponible. Appuie sur « Installer VM RADIO ». ';}else{status.textContent=info[platform].status;}}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;updateInstall()});
document.querySelectorAll('.platform').forEach(button=>button.addEventListener('click',()=>{platform=button.dataset.platform;const d=info[platform];icon.innerHTML=icons[platform];title.textContent=d.title;sub.textContent=d.sub;steps.innerHTML=d.steps;status.textContent=d.status;overlay.classList.add('open');updateInstall()}));
install.addEventListener('click',async()=>{if(!deferredPrompt){status.textContent=info[platform].status+' Utilise les étapes ci-dessus.';return}deferredPrompt.prompt();const result=await deferredPrompt.userChoice;deferredPrompt=null;status.textContent=result.outcome==='accepted'?'✅ VM RADIO est en cours d’installation.':'Installation annulée. Tu peux réessayer depuis ce bouton.';});
document.getElementById('close').addEventListener('click',()=>overlay.classList.remove('open'));overlay.addEventListener('click',e=>{if(e.target===overlay)overlay.classList.remove('open')});document.addEventListener('keydown',e=>{if(e.key==='Escape')overlay.classList.remove('open')});
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js?v=21',{updateViaCache:'none'}).catch(()=>{});}
</script>
</body>
</html>
