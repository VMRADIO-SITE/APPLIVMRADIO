<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09020f"><title>Télécharger l'application — VM RADIO</title><link rel="manifest" href="./manifest.webmanifest?v=9"><link rel="icon" type="image/png" href="./favicon-64.png?v=9"><link rel="apple-touch-icon" href="./apple-touch-icon.png?v=9"><style>:root{--bg:#050207;--purple:#8d35ff;--text:#fff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#2b0750 0,#09020f 38%,#030104 100%);color:#fff;font-family:Arial,Helvetica,sans-serif}.wrap{min-height:100vh;display:flex;justify-content:center;padding:28px 16px 50px}.page{width:min(100%,980px)}.hero{border:2px solid #b45cff;border-radius:28px;padding:28px;background:linear-gradient(145deg,rgba(28,8,43,.96),rgba(5,2,8,.98));box-shadow:0 0 35px rgba(145,45,255,.42)}.logo{width:150px;height:150px;object-fit:cover;display:block;margin:0 auto 15px;border-radius:25px}h1{margin:0;text-align:center;font-size:clamp(30px,6vw,58px);line-height:1;font-weight:900;text-transform:uppercase}h1 span{display:block;color:#d19aff;text-shadow:0 0 18px rgba(170,70,255,.8)}.subtitle{text-align:center;color:#eee;font-size:17px;margin:18px auto 0}.platforms{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-top:28px}.platform{appearance:none;-webkit-appearance:none;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:205px;padding:20px 14px;border:1px solid rgba(197,126,255,.32);border-radius:20px;background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.025));color:#fff;transition:.2s;cursor:pointer;font:inherit}.platform:hover{transform:translateY(-3px);border-color:#b45cff;box-shadow:0 10px 30px rgba(141,53,255,.25)}.icon{width:62px;height:62px;display:block;margin-bottom:15px;fill:currentColor}.platform h2{margin:0;font-size:19px}.platform p{margin:8px 0 0;color:#cfc6d8;text-align:center;font-size:12px;line-height:1.45}.action{margin-top:14px;padding:8px 13px;border-radius:10px;background:#21102d;border:1px solid #9b43ff;color:#fff;font-size:11px;font-weight:800}.continue{display:block;width:max-content;max-width:100%;margin:25px auto 0;text-decoration:none;color:#fff;background:#21102d;border:1px solid #a64cff;border-radius:13px;padding:12px 20px;font-weight:800}.note{text-align:center;color:#aaa;font-size:12px;margin-top:18px}.modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(0,0,0,.76);backdrop-filter:blur(7px)}.modal.show{display:flex}.modal-box{width:min(100%,520px);max-height:90vh;overflow:auto;padding:24px;border:2px solid #b45cff;border-radius:24px;background:linear-gradient(145deg,#1c082b,#07040a);box-shadow:0 0 40px rgba(145,45,255,.5);text-align:center}.modal-box .big-icon{font-size:46px;margin-bottom:8px}.modal-box h2{margin:0 0 8px;font-size:25px}.modal-box p{color:#ddd;font-size:14px;line-height:1.5}.steps{text-align:left;margin:18px 0;padding:16px 20px;border:1px solid rgba(197,126,255,.25);border-radius:15px;background:rgba(255,255,255,.035)}.steps li{margin:9px 0;color:#eee;line-height:1.45}.install-now{display:none;border:0;border-radius:11px;padding:11px 20px;background:linear-gradient(135deg,#c05cff,#7433dd);color:#fff;font-weight:800;cursor:pointer}.close{margin-top:12px;border:1px solid #9b43ff;border-radius:11px;padding:10px 20px;background:#21102d;color:#fff;font-weight:800;cursor:pointer}@media(max-width:800px){.platforms{grid-template-columns:repeat(2,1fr)}}@media(max-width:480px){.wrap{padding:16px 12px 40px}.hero{padding:20px 13px}.logo{width:125px;height:125px}.platforms{gap:10px}.platform{min-height:180px;padding:16px 8px}.platform h2{font-size:16px}.icon{width:52px;height:52px}.action{font-size:10px;padding:7px 10px}}</style></head><body><div class="wrap"><main class="page"><section class="hero"><img class="logo" src="./vmradio-app-logo.png?v=9" alt="
